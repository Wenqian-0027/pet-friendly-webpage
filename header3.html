<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";

            geometry: areaGeometry,
            spatialRelationship: "intersects",
            outFields: ["FID"],
            returnGeometry: false
          });

          targetLayer.queryFeatures(pointQuery).then(function(pointResults) {
            if (pointResults.features.length === 0) {

              targetLayer.definitionExpression = "1=0";
              return;
            }

            const fids = pointResults.features.map(feature => feature.attributes.FID);
            const definitionExpression = `FID IN (${fids.join(",")})`;
            targetLayer.definitionExpression = definitionExpression;
            console.log(`Filtered ${fids.length} points in ${selectedArea}`);
          }).catch(function(error) {
            console.error("Error querying points:", error);
          });
        }).catch(function(error) {
          console.error("Error querying study area:", error);
        });
      }

      function performOverlayAnalysis() {
        overlayLayer.removeAll();

        const bufferLayers = [
          { layer: store_servicearea, name: "Pet Store Service Area", visible: document.getElementById("storeServiceArea").checked },
          { layer: inclusivePark_servicearea, name: "InclusivePark Service Area", visible: document.getElementById("subwayServiceArea").checked },
          { layer: petgarden_servicearea, name: "Pet Garden Service Area", visible: document.getElementById("petgardenServiceArea").checked },
          { layer: pet_friendly_restaurant_servicearea, name: "Restaurant Service Area", visible: document.getElementById("restaurantServiceArea").checked },
          { layer: pet_clinic_servicearea, name: "Clinic Service Area", visible: document.getElementById("clinicServiceArea").checked },
          { layer: pet_friendly_mall_servicearea, name: "Mall Service Area", visible: document.getElementById("mallServiceArea").checked },
          { layer: MTR_servicearea, name: "MTR Service Area", visible: document.getElementById("MTRServiceArea").checked }
        ].filter(b => b.visible);

        if (bufferLayers.length === 0) {
          alert("Please select at least one buffer layer.");
          return;
        }

        const bufferPromises = bufferLayers.map(({ layer, name }) => {
          const query = layer.createQuery();
          query.where = "1=1";
          query.outFields = ["*"];
          query.returnGeometry = true;

          return layer.queryFeatures(query).then(function(response) {
            if (response.features.length === 0) {
              console.warn(`No features found for layer ${name}`);
              return null;
            }

            const geometries = response.features
              .map(f => f.geometry)
              .filter(g => g && g.type === "polygon");
            if (geometries.length === 0) {
              console.warn(`No valid geometries for layer ${name}`);
              return null;
            }

            try {
              const dissolvedBuffer = geometryEngine.union(geometries);
              if (!dissolvedBuffer) throw new Error(`Failed to dissolve geometries for ${name}`);
              return { geometry: dissolvedBuffer, layer: name };
            } catch (error) {
              console.error(`Error processing geometries for ${name}:`, error);
              return null;
            }
          }).catch(error => {
            console.error(`Error querying features for ${name}:`, error);
            return null;
          });
        });

        Promise.all(bufferPromises).then(function(dissolvedBuffers) {
          dissolvedBuffers = dissolvedBuffers.filter(b => b !== null && b.geometry);
          if (dissolvedBuffers.length === 0) {
            alert("No valid buffer geometries found. Check layer data.");
            return;
          }

          const extent = dissolvedBuffers.reduce((ext, buf) => {
            const bufExtent = buf.geometry.extent;
            return ext ? ext.union(bufExtent) : bufExtent.clone();
          }, null);

          const cellSize = Math.min(extent.width, extent.height) / 50;
          const gridPolys = [];
          for (let x = extent.xmin; x < extent.xmax; x += cellSize) {
            for (let y = extent.ymin; y < extent.ymax; y += cellSize) {
              const poly = new Polygon({
                rings: [[
                  [x, y],
                  [x + cellSize, y],
                  [x + cellSize, y + cellSize],
                  [x, y + cellSize],
                  [x, y]
                ]],
                spatialReference: extent.spatialReference
              });
              gridPolys.push(poly);
            }
          }

          const overlayGeometries = gridPolys.map(poly => {
            const count = dissolvedBuffers.filter(buf =>
              geometryEngine.intersects(poly, buf.geometry)
            ).length;
            return count > 0 ? { geometry: poly, count } : null;
          }).filter(g => g !== null);

          const maxCount = Math.max(...overlayGeometries.map(g => g.count), 1);
          const renderer = new ClassBreaksRenderer({
            field: "Overlap_Count",
            classBreakInfos: Array.from({ length: maxCount }, (_, i) => ({
              minValue: i + 1,
              maxValue: i + 1,
              symbol: new SimpleFillSymbol({
                color: [255, 255 - (i + 1) * (255 / maxCount), 0, 0.5],
                outline: { color: [0, 0, 0, 0.8], width: 1 }
              }),
              label: `${i + 1} Overlaps`
            }))
          });
          overlayLayer.renderer = renderer;

          const overlayGraphics = overlayGeometries.map(({ geometry, count }) => new Graphic({
            geometry,
            attributes: { Overlap_Count: count },
            symbol: new SimpleFillSymbol({
              color: [255, 255 - count * (255 / maxCount), 0, 0.5],
              outline: { color: [0, 0, 0, 0.8], width: 0.1 }
            }),
            popupTemplate: {
              title: "Overlay Region",
              content: [{
                type: "fields",
                fieldInfos: [
                  { fieldName: "Overlap_Count", label: "Number of Overlapping Buffers" }
                ]
              }]
            }
          }));

          overlayLayer.addMany(overlayGraphics);
          
          bufferLayers.forEach(({ layer }) => {
            layer.visible = false;
          });

          console.log(`Generated overlay with ${overlayGraphics.length} regions, max overlap: ${maxCount}`);
        }).catch(function(error) {
          console.error("Error in overlay processing:", error);
          alert("Failed to generate overlay. Check console for details.");
        });
      }

      function summarizeNearbyFacilities() {
        nearbySummaryLayer.removeAll();

        const selectedLayerType = document.getElementById("layerSelect").value;
        const bufferDistanceInput = document.getElementById("bufferDistance").value;
        const bufferDistance = parseFloat(bufferDistanceInput);

        if (isNaN(bufferDistance) || bufferDistance <= 0) {
          alert("Please enter a valid buffer distance (positive number in meters).");
          return;
        }

        let facilityLayer;
        let facilityTitle;

        switch (selectedLayerType) {
          case "pet_store":
            facilityLayer = pet_store;
            facilityTitle = "Pet Stores";
            break;
          case "inclusive_park":
            facilityLayer = inclusive_park;
            facilityTitle = "Inclusive Parks";
            break;
          case "pet_garden":
            facilityLayer = pet_garden;
            facilityTitle = "Pet Gardens";
            break;
          case "pet_friendly_restaurant":
            facilityLayer = pet_friendly_restaurant;
            facilityTitle = "Pet-Friendly Restaurants";
            break;
          case "pet_clinic":
            facilityLayer = pet_clinic;
            facilityTitle = "Pet Clinics";
            break;
          case "pet_friendly_mall":
            facilityLayer = pet_friendly_mall;
            facilityTitle = "Pet-Friendly Malls";
            break;
          case "MTR":
            facilityLayer = MTR;
            facilityTitle = "MTR Stations";
            break;
          default:
            alert("Please select a valid facility type for nearby analysis.");
            return;
        }

        const houseQuery = pet_friendly_house.createQuery();
        houseQuery.where = pet_friendly_house.definitionExpression || "1=1";
        houseQuery.outFields = ["*"];
        houseQuery.returnGeometry = true;

        pet_friendly_house.queryFeatures(houseQuery).then(function(houseResults) {
          if (houseResults.features.length === 0) {
            alert("No pet-friendly houses found in the current filter.");
            return;
          }

          const facilityQuery = facilityLayer.createQuery();
          facilityQuery.where = facilityLayer.definitionExpression || "1=1";
          facilityQuery.outFields = ["*"];
          facilityQuery.returnGeometry = true;

          facilityLayer.queryFeatures(facilityQuery).then(function(facilityResults) {
            if (facilityResults.features.length === 0) {
              alert(`No ${facilityTitle.toLowerCase()} found in the current filter.`);
              return;
            }

            const houseFeatures = houseResults.features;
            const facilityFeatures = facilityResults.features;
            const summaryGraphics = [];

            houseFeatures.forEach(house => {
              const housePoint = house.geometry;
              const buffer = geometryEngine.geodesicBuffer(housePoint, bufferDistance, "meters");

              let nearbyCount = 0;
              facilityFeatures.forEach(facility => {
                if (geometryEngine.intersects(buffer, facility.geometry)) {
                  nearbyCount++;
                }
              });

              const color = nearbyCount === 0 
                ? [200, 200, 255, 0.6] 
                : [0, 100 + (155 * nearbyCount / (nearbyCount + 1)), 255, 0.6];

              const symbol = new SimpleMarkerSymbol({
                style: "circle",
                size: 8 + nearbyCount * 3,
                color: [173, 216, 230, 0.6], 
                outline: { color: [0, 0, 0, 0.8], width: 0.2 }
              });

              const graphic = new Graphic({
                geometry: housePoint,
                symbol: symbol,
                attributes: {
                  House_Name: house.attributes.name,
                  Nearby_Count: nearbyCount,
                  Buffer_Distance: bufferDistance
                },
                popupTemplate: {
                  title: "{House_Name}",
                  content: [{
                    type: "fields",
                    fieldInfos: [
                      { fieldName: "Nearby_Count", label: `Number of Nearby ${facilityTitle}` },
                      { fieldName: "Buffer_Distance", label: "Buffer Distance (meters)" }
                    ]
                  }]
                }
              });

              summaryGraphics.push(graphic);
            });

            const maxCount = Math.max(...summaryGraphics.map(g => g.attributes.Nearby_Count), 1);
            const renderer = new ClassBreaksRenderer({
              field: "Nearby_Count",
              classBreakInfos: Array.from({ length: maxCount + 1 }, (_, i) => ({
                minValue: i,
                maxValue: i,
                symbol: new SimpleMarkerSymbol({
                  style: "circle",
                  size: 8 + i * 3,
                  color: i === 0 ? [200, 200, 255, 0.6] : [0, 100 + (155 * i / (i + 1)), 255, 0.6],
                  outline: { color: [0, 0, 0, 0.8], width: 1 }
                }),
                label: i === 0 ? "0 Facilities" : `${i} ${facilityTitle}`
              }))
            });

            nearbySummaryLayer.renderer = renderer;
            nearbySummaryLayer.addMany(summaryGraphics);

            console.log(`Summarized ${summaryGraphics.length} houses with nearby ${facilityTitle}, max count: ${maxCount}, buffer distance: ${bufferDistance} meters`);
          }).catch(function(error) {
            console.error("Error querying facilities:", error);
            alert("Failed to query facilities. Check console for details.");
          });
        }).catch(function(error) {
          console.error("Error querying houses:", error);
          alert("Failed to query houses. Check console for details.");
        });
      }

      document.getElementById("layerSelect").addEventListener("change", applySpatialFilter);
      document.getElementById("areaSelect").addEventListener("change", applySpatialFilter);
      document.getElementById("storeServiceArea").addEventListener("change", function(event) {
        store_servicearea.visible = event.target.checked;
      });
      document.getElementById("subwayServiceArea").addEventListener("change", function(event) {
        inclusivePark_servicearea.visible = event.target.checked;
      });
      document.getElementById("petgardenServiceArea").addEventListener("change", function(event) {
        petgarden_servicearea.visible = event.target.checked;
      });
      document.getElementById("restaurantServiceArea").addEventListener("change", function(event) {
        pet_friendly_restaurant_servicearea.visible = event.target.checked;
      });
      document.getElementById("clinicServiceArea").addEventListener("change", function(event) {
        pet_clinic_servicearea.visible = event.target.checked;
      });
      document.getElementById("mallServiceArea").addEventListener("change", function(event) {
        pet_friendly_mall_servicearea.visible = event.target.checked;
      });
      document.getElementById("MTRServiceArea").addEventListener("change", function(event) {
        MTR_servicearea.visible = event.target.checked;
      }); 
      document.getElementById("showStudyArea").addEventListener("change", function() {
        study_area.visible = this.checked;
      });
      document.getElementById("showhouse").addEventListener("change", function() {
        house_steady.visible = this.checked;
      });

      document.getElementById("generateOverlayBtn").addEventListener("click", performOverlayAnalysis);
      document.getElementById("summarizeNearbyBtn").addEventListener("click", summarizeNearbyFacilities);

      view.when(() => {
        applySpatialFilter();
      });
    });
  </script>
